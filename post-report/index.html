<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QC Post Report — Streams of Joy International</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4F6EF7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SOJ QC">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  :root {
    --blue: #4F6EF7;
    --purple: #9B4FF7;
    --grad: linear-gradient(135deg, var(--blue), var(--purple));
    --ink: #1E2233;
    --muted: #6B7280;
    --line: rgba(148, 130, 255, 0.22);
    --card: rgba(255, 255, 255, 0.72);
    --success-bg: #D1FAE5; --success-text: #047857;
    --danger-bg: #FEE2E2; --danger-text: #B91C1C;
    --warn-bg: #FEF3C7; --warn-text: #92400E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 10%, rgba(79,110,247,0.14), transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(155,79,247,0.14), transparent 45%),
      linear-gradient(160deg, #F6F5FF 0%, #FFFFFF 45%, #F3F0FF 100%);
    padding: 40px 16px 80px;
  }
  .wrap { max-width: 620px; margin: 0 auto; }
  .hero { text-align: center; margin-bottom: 28px; }
  .crest {
    width: 84px; height: 84px; border-radius: 22px; margin: 0 auto 18px;
    background: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 30px rgba(120, 90, 255, 0.25);
  }
  .crest svg { width: 46px; height: 46px; }
  h1 {
    font-size: 34px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.5px;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline { color: var(--muted); font-size: 15px; margin: 0 0 6px; line-height: 1.5; }
  .brand { color: #A6A0C4; font-size: 11.5px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }

  .chip-row { display: flex; justify-content: center; gap: 12px; margin: 22px 0 16px; flex-wrap: wrap; }
  .chip {
    background: var(--card); backdrop-filter: blur(8px); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 18px; font-size: 14px; font-weight: 600; color: var(--ink);
    display: flex; align-items: center; gap: 8px;
  }
  .chip .ic { font-size: 16px; }

  .status-pill {
    display: block; width: fit-content; margin: 0 auto 24px; padding: 8px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 700; background: var(--success-bg); color: var(--success-text);
  }

  .card {
    background: var(--card); backdrop-filter: blur(10px); border: 1.5px solid var(--line);
    border-radius: 20px; padding: 26px 24px 30px; box-shadow: 0 10px 40px rgba(120,90,255,0.10);
  }
  .card-title { font-size: 19px; font-weight: 800; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .card-sub { color: var(--muted); font-size: 13.5px; margin: 0 0 20px; }

  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--purple); margin: 26px 0 12px; display: flex; align-items: center; gap: 8px;
  }
  .section-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  label { display: block; font-size: 12.5px; font-weight: 700; color: #3A3F55; margin: 14px 0 6px; letter-spacing: 0.2px; }
  input[type=text], input[type=date], input[type=number], select, textarea {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #E4E1F5;
    background: #fff; font-size: 14.5px; color: var(--ink); font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--purple); box-shadow: 0 0 0 3px rgba(155,79,247,0.15); }
  textarea { min-height: 64px; resize: vertical; }

  .pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    flex: 1; min-width: 72px; padding: 10px 0; text-align: center; border-radius: 12px;
    border: 1.5px solid #E4E1F5; cursor: pointer; font-size: 13px; font-weight: 600; color: #4B4F66; background: #fff;
    transition: all .15s ease;
  }
  .pill.active { background: var(--grad); border-color: transparent; color: #fff; }

  .unit-card { border: 1.5px dashed var(--purple); background: rgba(155,79,247,0.06); border-radius: 16px; padding: 16px; margin-top: 16px; }
  .unit-title { font-weight: 800; color: var(--purple); font-size: 13.5px; margin-bottom: 8px; }

  .checkbox-row { display: flex; gap: 10px; align-items: flex-start; margin-top: 20px; font-size: 13px; color: #3A3F55; }
  .checkbox-row input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--purple); }

  button.submit {
    width: 100%; padding: 15px; margin-top: 24px; border: none; border-radius: 14px;
    background: var(--grad); color: #fff; font-size: 15.5px; font-weight: 800; cursor: pointer;
    box-shadow: 0 10px 25px rgba(120,90,255,0.30);
  }
  button.submit:disabled { opacity: 0.5; cursor: not-allowed; }

  .msg { margin-top: 16px; padding: 13px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600; display: none; }
  .msg.ok { display: block; background: var(--success-bg); color: var(--success-text); }
  .msg.err { display: block; background: var(--danger-bg); color: var(--danger-text); }
  .required { color: #DC2626; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
</style>
</head>
<body>
  <div class="wrap">
    <a href="/" style="display:inline-block; margin-bottom:14px; color:var(--muted); font-size:13px; text-decoration:none; font-weight:600;">← All QC Tools</a>
    <div class="hero">
      <div class="crest">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L14 10L22 12L14 14L12 22L10 14L2 12L10 10L12 2Z" fill="url(#g)"/><defs><linearGradient id="g" x1="2" y1="2" x2="22" y2="22"><stop stop-color="#4F6EF7"/><stop offset="1" stop-color="#9B4FF7"/></linearGradient></defs></svg>
      </div>
      <h1>QC Post Report</h1>
      <p class="tagline">Headcount and observation reporting for every post, every service.</p>
      <div class="brand">STREAMS OF JOY INTERNATIONAL</div>
    </div>

    <div class="chip-row">
      <div class="chip"><span class="ic">📅</span><span id="chipDate">—</span></div>
      <div class="chip"><span class="ic">🕐</span><span id="chipTime">—</span></div>
    </div>
    <div class="status-pill">✓ Reporting Open</div>

    <div class="card">
      <div class="card-title">✦ Submit Post Report</div>
      <p class="card-sub">Complete this immediately after observing your assigned post.</p>
      <div class="loading" id="loading">Loading form…</div>
      <div id="content" style="display:none;"></div>
    </div>
  </div>

<script>
  // ====== CONFIG — paste your deployed Apps Script Web App URL here ======
  const API_URL = 'https://script.google.com/macros/s/AKfycbxnkfYzaXYx8qwQtYw2GPxW3X0W4BvtivbCLNNKcftxLICNqCkCUnQO02t_Nbp05mVO/exec';
  // ==========================================================================

  let ctx = null;
  const vals = { ma: { safetyFlag: 'No' }, teens: {}, incidentFlag: 'No' };

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function pillGroup(id, options, current) {
    return `<div class="pill-row" data-field="${id}">` +
      options.map(o => `<div class="pill${current===o?' active':''}" data-val="${esc(o)}">${esc(o)}</div>`).join('') +
      `</div>`;
  }

  function render() {
    document.getElementById('chipDate').textContent = ctx.date;
    document.getElementById('chipTime').textContent = ctx.time;

    const areaOptions = ctx.areas.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join('');

    document.getElementById('content').innerHTML = `
      <div class="section-label">Observer Info</div>
      <label>Date *</label><input type="date" id="date" value="${esc(ctx.date)}">
      <label>Service *</label>
      <select id="service">
        <option value="">Select service</option>
        <option value="1st Service">1st Service</option>
        <option value="2nd Service">2nd Service</option>
        <option value="3rd Service">3rd Service</option>
        <option value="4th Service">4th Service</option>
        <option value="Thursday Service">Thursday Service</option>
      </select>
      <label>Full Name *</label><input type="text" id="name" placeholder="Your name">
      <label>Observation Area *</label><select id="area"><option value="">Select area</option>${areaOptions}</select>
      <label>Adult Headcount</label><input type="number" min="0" id="adultsHeadcount" value="0">
      <label>Children Headcount <span style="font-weight:400;color:var(--muted);">(incl. kids with parents outside children's classes)</span></label>
      <input type="number" min="0" id="childrenHeadcount" value="0">

      <div class="section-label">Observation</div>
      <label>Area properly prepared before service? *</label>${pillGroup('preparedness', ctx.ratings, '')}
      <label>Neatness and Appearance *</label>${pillGroup('neatness', ctx.ratings, '')}
      <label>Orderliness During Service *</label>${pillGroup('orderliness', ctx.ratings, '')}
      <label>Workers' Conduct and Professionalism *</label>${pillGroup('conduct', ctx.ratings, '')}
      <label>Compliance with Church Guidelines *</label>${pillGroup('compliance', ctx.ratings, '')}
      <label>Overall Coordination *</label>${pillGroup('coordination', ctx.ratings, '')}
      <label>Overall Rating *</label>${pillGroup('overallRating', ctx.overallRatings, '')}

      <div class="section-label">Comments</div>
      <label>What went well?</label><textarea id="whatWentWell"></textarea>
      <label>Areas that need improvement</label><textarea id="areasForImprovement"></textarea>
      <label>Recommendations</label><textarea id="recommendations"></textarea>
      <label>Incidents requiring leadership's attention?</label>${pillGroup('incidentFlag', ['Yes','No'], 'No')}
      <div id="incidentWrap" style="display:none;"><label>Describe the incident</label><textarea id="incidentDescribe"></textarea></div>

      <div id="arrowsPanel"></div>
      <div id="teensPanel"></div>

      <div class="section-label">Final</div>
      <label>Additional Comments</label><textarea id="additionalComments"></textarea>
      <div class="checkbox-row"><input type="checkbox" id="confirmAccurate"><label for="confirmAccurate" style="margin:0;font-weight:500;">I confirm this report is accurate to the best of my knowledge. *</label></div>

      <div class="msg" id="msg"></div>
      <button class="submit" id="submitBtn">Submit Report</button>
    `;

    bindPills();
    document.getElementById('area').addEventListener('change', onAreaChange);
    document.getElementById('submitBtn').addEventListener('click', submit);
  }

  function bindPills() {
    document.querySelectorAll('.pill-row').forEach(row => {
      row.addEventListener('click', e => {
        const pill = e.target.closest('.pill');
        if (!pill) return;
        row.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        const field = row.getAttribute('data-field');
        const val = pill.getAttribute('data-val');
        setVal(field, val);
        if (field === 'incidentFlag') {
          document.getElementById('incidentWrap').style.display = val === 'Yes' ? 'block' : 'none';
        }
        if (field === 'ma.safetyFlag') {
          const w = document.getElementById('maSafetyWrap');
          if (w) w.style.display = val === 'Yes' ? 'block' : 'none';
        }
      });
    });
  }

  function setVal(field, val) {
    if (field.startsWith('ma.')) vals.ma[field.slice(3)] = val;
    else if (field.startsWith('teens.')) vals.teens[field.slice(6)] = val;
    else vals[field] = val;
  }

  function onAreaChange() {
    const area = document.getElementById('area').value;
    const isArrows = area.startsWith('Mighty Arrows');
    const isTeens = area.startsWith('Teens');

    document.getElementById('arrowsPanel').innerHTML = isArrows ? `
      <div class="unit-card"><div class="unit-title">Mighty Arrows — ${esc(area)}</div>
        <label>Topic Taught *</label><textarea id="maTopic"></textarea>
        <label>Teacher/Archer Preparedness</label>${pillGroup('ma.teacherPreparedness', ctx.ratings, '')}
        <label>Children's Participation</label>${pillGroup('ma.childrenParticipation', ctx.ratings, '')}
        <label>Children's Behaviour</label>${pillGroup('ma.childrenBehaviour', ctx.ratings, '')}
        <label>Safety Concerns Observed?</label>${pillGroup('ma.safetyFlag', ['Yes','No'], 'No')}
        <div id="maSafetyWrap" style="display:none;"><label>Describe</label><textarea id="maSafetyDescribe"></textarea></div>
      </div>` : '';

    document.getElementById('teensPanel').innerHTML = isTeens ? `
      <div class="unit-card"><div class="unit-title">${esc(area)}</div>
        <label>Lesson Topic *</label><textarea id="teensTopic"></textarea>
        <label>Teacher Preparedness</label>${pillGroup('teens.teacherPreparedness', ctx.ratings, '')}
        <label>Teen Engagement</label>${pillGroup('teens.engagement', ctx.ratings, '')}
        <label>Classroom Management</label>${pillGroup('teens.classroomMgmt', ctx.ratings, '')}
      </div>` : '';

    bindPills();
  }

  async function submit() {
    const msg = document.getElementById('msg');
    msg.className = 'msg'; msg.style.display = 'none';

    const payload = {
      date: document.getElementById('date').value,
      service: document.getElementById('service').value,
      name: document.getElementById('name').value,
      area: document.getElementById('area').value,
      adultsHeadcount: document.getElementById('adultsHeadcount').value,
      childrenHeadcount: document.getElementById('childrenHeadcount').value,
      preparedness: vals.preparedness, neatness: vals.neatness, orderliness: vals.orderliness,
      conduct: vals.conduct, compliance: vals.compliance, coordination: vals.coordination, overallRating: vals.overallRating,
      whatWentWell: document.getElementById('whatWentWell').value,
      areasForImprovement: document.getElementById('areasForImprovement').value,
      recommendations: document.getElementById('recommendations').value,
      incidentFlag: vals.incidentFlag,
      incidentDescribe: document.getElementById('incidentDescribe') ? document.getElementById('incidentDescribe').value : '',
      ma: { ...vals.ma, topicTaught: document.getElementById('maTopic') ? document.getElementById('maTopic').value : '', safetyDescribe: document.getElementById('maSafetyDescribe') ? document.getElementById('maSafetyDescribe').value : '' },
      teens: { ...vals.teens, lessonTopic: document.getElementById('teensTopic') ? document.getElementById('teensTopic').value : '' },
      additionalComments: document.getElementById('additionalComments').value,
      confirmAccurate: document.getElementById('confirmAccurate').checked
    };

    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Submitting…';

    try {
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
      const result = await res.json();
      msg.className = 'msg ' + (result.ok ? 'ok' : 'err');
      msg.textContent = result.message;
      msg.style.display = 'block';
      if (result.ok) setTimeout(() => location.reload(), 1800);
    } catch (err) {
      msg.className = 'msg err';
      msg.textContent = 'Could not reach the server. Check your connection and try again.';
      msg.style.display = 'block';
    }
    btn.disabled = false; btn.textContent = 'Submit Report';
  }

  async function init() {
    try {
      const res = await fetch(API_URL + '?action=getContext');
      ctx = await res.json();
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      render();
    } catch (err) {
      document.getElementById('loading').innerHTML = 'Could not load the form. Check the API_URL is set correctly in script.js.';
    }
  }
  init();
</script>
<script src="/pwa.js" defer></script>
<script src="/emergency-notify.js" defer></script>
</body>
</html>
